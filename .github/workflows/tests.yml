# The suite, on every pull request. Copied from Accessibility Gate, whose suite
# this one boots alongside: the gate is a dependency, resolved from Packagist
# like any other.
#
# Two jobs for the same reason the gate has two: ext-intl is a `suggest` there,
# and the checker this addon runs behaves differently without it. A scan on a
# host with no intl must still run.
#
# A third is the oldest PHP the manifest allows, with the oldest version of
# every dependency it allows, the gate included. A floor in composer.json is a
# promise about a machine nobody on this project runs, and the only thing that
# makes it true is a runner that is that machine. When this job goes red on a
# commit that changed nothing, a dependency raised its own floor, and that is
# the moment to raise ours rather than the moment a customer finds out.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here writes to the repository, comments on a pull request,
# or touches a package registry, so it should not be able to.
permissions:
  contents: read

# A second push to the same branch cancels the first. The suite takes seconds
# and the answer for an overwritten commit is worth nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      # Both jobs run to completion. Knowing that only the no-intl one broke is
      # most of the diagnosis, and cancelling it to save a minute throws that
      # away.
      fail-fast: false
      matrix:
        include:
          - name: with ext-intl
            php: '8.4'
            extensions: dom, libxml, mbstring, intl
            dependencies: highest
          # The leading colon is how setup-php removes an extension it would
          # otherwise ship by default. Without it this job would silently be a
          # duplicate of the one above.
          - name: without ext-intl
            php: '8.4'
            extensions: dom, libxml, mbstring, :intl
            dependencies: highest
          - name: lowest dependencies
            php: '8.2'
            extensions: dom, libxml, mbstring, intl
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          coverage: none

      # Before installing, because a malformed manifest on a published package
      # is otherwise found by Packagist, which is later and in front of an
      # audience. Publish checks left on for the same reason.
      - name: Check the manifest is well formed
        run: composer validate --strict

      # There is no composer.lock in this repository and there should not be:
      # this is a package an application installs, so the application's lock is
      # the one that matters. That makes every run here a fresh resolve against
      # the current Statamic, which is worth having. When this goes red on a
      # commit that changed nothing, a dependency moved, and that is a finding
      # rather than a nuisance.
      - name: Install dependencies
        if: matrix.dependencies == 'highest'
        run: composer install --prefer-dist --no-interaction --no-progress

      # `--prefer-lowest` alone would take the oldest *pre-release* of anything
      # that has one; `--prefer-stable` with it takes the oldest stable, which
      # is the oldest thing a real install can end up with.
      - name: Install the oldest dependencies the manifest allows
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      # The PDF tests and the whole axe engine skip without Chrome, and a
      # skipped test is reported as a pass. Fail here instead, where the reason
      # is one line, so a runner image that drops Chrome cannot make the tagged
      # PDF and the second engine quietly untested.
      - name: Confirm Chrome is here so the PDF and axe tests run rather than skip
        run: google-chrome --version

      # veraPDF, for the PDF/UA checks. The test asserts the clauses this
      # addon controls (structure tree, metadata title, language) and reports
      # the rest, because a conformance report that ships untagged is the
      # story about this product, and the only way to know is to validate.
      # The installer is IzPack with an unattended answers file. The first
      # version of this step guessed the release URL and the first CI run
      # said so; this one was downloaded and run unattended on a Mac first.
      - name: Install veraPDF
        run: |
          curl -sSL -o /tmp/verapdf.zip https://software.verapdf.org/rel/1.30/verapdf-greenfield-1.30.2-installer.zip
          cd /tmp && unzip -q verapdf.zip
          cat > /tmp/verapdf-auto.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>/opt/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="true"/>
                  <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
                  <pack index="2" name="veraPDF Validation model" selected="false"/>
                  <pack index="3" name="veraPDF Documentation" selected="false"/>
                  <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          sudo java -jar /tmp/verapdf-greenfield-1.30.2/verapdf-izpack-installer-1.30.2.jar /tmp/verapdf-auto.xml
          sudo ln -sf /opt/verapdf/verapdf /usr/local/bin/verapdf
          verapdf --version

      - name: Run the suite
        run: ./vendor/bin/pest
